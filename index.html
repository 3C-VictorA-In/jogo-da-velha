<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c1020"><title>Mambo vs ZA WARUDO | Jogo da Velha</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap');
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d33;--line:#2a3553;--text:#f7f8ff;--muted:#98a5c2;--pink:#ff72a9;--gold:#f9ca62}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Outfit,system-ui,sans-serif;color:var(--text);background:radial-gradient(ellipse at 12% 8%,#293052 0,transparent 42%),radial-gradient(ellipse at 90% 85%,#3a2940 0,transparent 40%),var(--bg);display:grid;place-items:center;padding:28px 16px}.shell{width:min(100%,520px)}.eyebrow{text-align:center;color:#a6b1ce;font-size:12px;font-weight:800;letter-spacing:.27em;text-transform:uppercase}.heading{text-align:center;font-size:clamp(32px,8vw,51px);letter-spacing:-.06em;margin:8px 0 5px;font-weight:900}.heading span{color:var(--pink)}.sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 25px}.arena{background:linear-gradient(155deg,#1a2440,#121a2e);border:1px solid #34415d;border-radius:27px;padding:20px;box-shadow:0 25px 70px #05081680, inset 0 1px #ffffff10}.players{display:grid;grid-template-columns:1fr 42px 1fr;align-items:center;gap:8px}.player{display:flex;align-items:center;gap:10px;min-width:0;padding:11px;border-radius:17px;border:1px solid transparent;background:#ffffff06;transition:.2s}.player.active.mambo{background:#ff72a912;border-color:#ff72a969}.player.active.world{background:#f9ca6212;border-color:#f9ca6269}.portrait{width:48px;height:48px;flex-shrink:0;display:grid;place-items:center;border-radius:14px;background:#202b44;overflow:hidden}.portrait img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 5px #0008)}.player-name{font-size:13px;font-weight:800;line-height:1.15}.player-label{font-size:10px;color:var(--muted);margin-top:4px}.vs{text-align:center;font-size:13px;font-weight:900;color:#7785a8}.status{margin:20px 0 16px;min-height:43px;border-radius:13px;background:#0c1428;border:1px solid #293653;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:14px;text-align:center;padding:9px}.dot{height:9px;width:9px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px var(--pink)}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.cell{aspect-ratio:1;border:1px solid #3a4968;border-radius:17px;background:linear-gradient(145deg,#25314d,#1c263e);display:grid;place-items:center;cursor:pointer;transition:transform .16s,background .16s,border-color .16s;position:relative;padding:12%;min-width:0}.cell:not(:disabled):hover{transform:translateY(-2px);background:#30415e;border-color:#8290b0}.cell:focus-visible,.action:focus-visible{outline:3px solid #a3c4ff;outline-offset:3px}.cell:disabled{cursor:default}.cell img{width:100%;height:100%;max-width:110px;object-fit:contain;filter:drop-shadow(0 5px 8px #0005);animation:pop .23s ease-out}.cell.win{background:#3a3e51;border-color:#f9d98e;box-shadow:inset 0 0 0 1px #f9d98e55,0 0 20px #f9ca6220}@keyframes pop{from{transform:scale(.5);opacity:.3}to{transform:scale(1);opacity:1}}.footer{display:flex;gap:10px;margin-top:18px}.action{border:0;border-radius:13px;padding:14px 12px;font:800 14px Outfit,system-ui;cursor:pointer;transition:.2s}.action:hover{filter:brightness(1.12);transform:translateY(-1px)}.primary{flex:1;background:linear-gradient(100deg,#ff76aa,#ff9b9b);color:#25132b}.secondary{background:#2b3753;color:#e1e7f7}.sound-toggle{display:block;margin:12px auto 0;background:transparent;border:1px solid #51607d;color:#e7eafa;border-radius:10px;padding:9px 15px;font:700 12px Outfit,system-ui;cursor:pointer}.sound-toggle:hover{background:#ffffff12}.scoreboard{display:flex;justify-content:space-around;text-align:center;margin:22px 0 0}.score strong{display:block;font-size:24px}.score small{font-size:11px;color:var(--muted)}.score:first-child strong{color:var(--pink)}.score:last-child strong{color:var(--gold)}.note{text-align:center;color:#7683a3;font-size:11px;margin:20px 0 0}@media(max-width:420px){.arena{padding:13px;border-radius:20px}.player{gap:6px;padding:7px}.portrait{width:39px;height:39px}.player-name{font-size:11px}.board{gap:7px}.cell{border-radius:13px}.status{font-size:12px}}
</style>
</head>
<body>
<main class="shell"><div class="eyebrow">Uma Musume × JoJo</div><h1 class="heading"><span>MAMBO</span> vs <span style="color:var(--gold)">WORLD</span></h1><p class="sub">Um duelo lendário em 3 × 3</p>
<section class="arena" aria-label="Jogo da velha"><div class="players"><div class="player mambo active" id="playerX"><div class="portrait" id="avatarX"></div><div><div class="player-name">Mambo</div><div class="player-label">Uma Musume · X</div></div></div><div class="vs">VS</div><div class="player world" id="playerO"><div class="portrait" id="avatarO"></div><div><div class="player-name">ZA WARUDO</div><div class="player-label">JoJo · O</div></div></div></div>
<div class="status" id="status" role="status" aria-live="polite"><span class="dot" id="dot"></span><span id="statusText">Vez da Mambo!</span></div><div class="board" id="board" aria-label="Tabuleiro com nove casas"></div><div class="footer"><button class="action primary" id="reset">↻ Nova rodada</button><button class="action secondary" id="clear">Zerar placar</button></div><button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true">🔊 Som ligado</button><div class="scoreboard"><div class="score"><strong id="scoreX">0</strong><small>Vitórias Mambo</small></div><div class="score"><strong id="scoreD">0</strong><small>Empates</small></div><div class="score"><strong id="scoreO">0</strong><small>Vitórias ZA WARUDO</small></div></div></section><p class="note">Dois jogadores no mesmo dispositivo · Feito para fãs</p></main>
<script>

const icons={X:'<img src="imagens/mambo.png" alt="Mambo">',O:'<img src="imagens/za-warudo.png" alt="ZA WARUDO">'};
document.getElementById('avatarX').innerHTML=icons.X;document.getElementById('avatarO').innerHTML=icons.O;

const audioFiles={X:'audios/mambo.mp3',O:'audios/za-warudo.mp3'};
const audioClips={X:new Audio(audioFiles.X),O:new Audio(audioFiles.O)};
let soundEnabled=true;
function speakFallback(mark){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(mark==='X'?'Mambo!':'Za Warudo!');
  utterance.lang=mark==='X'?'ja-JP':'ja-JP';
  utterance.rate=mark==='X'?1.08:0.78;
  utterance.pitch=mark==='X'?1.45:0.72;
  utterance.volume=1;
  window.speechSynthesis.speak(utterance);
}
function playSound(mark){
  if(!soundEnabled)return;
  const clip=audioClips[mark];
  for(const audio of Object.values(audioClips)){audio.pause();audio.currentTime=0;}
  if('speechSynthesis' in window)window.speechSynthesis.cancel();

  if(clip.error || clip.networkState===HTMLMediaElement.NETWORK_NO_SOURCE){speakFallback(mark);return;}
  clip.currentTime=0;
  clip.play().catch(()=>speakFallback(mark));
}
for(const mark of ['X','O'])audioClips[mark].addEventListener('error',()=>{});
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let board=Array(9).fill(null),turn='X',winner=null,winning=[],draw=false,scores={X:0,O:0,D:0};const el=id=>document.getElementById(id);
function render(){el('board').innerHTML='';board.forEach((mark,i)=>{const btn=document.createElement('button');btn.className='cell'+(winning.includes(i)?' win':'');btn.type='button';btn.setAttribute('aria-label',`Casa ${i+1}: ${mark?(mark==='X'?'Mambo':'ZA WARUDO'):'vazia'}`);btn.disabled=!!mark||!!winner||draw;if(mark)btn.innerHTML=icons[mark];btn.addEventListener('click',()=>play(i));el('board').appendChild(btn)});el('playerX').classList.toggle('active',turn==='X'&&!winner&&!draw);el('playerO').classList.toggle('active',turn==='O'&&!winner&&!draw);el('statusText').textContent=winner?(winner==='X'?'Mambo venceu! 🎉':'ZA WARUDO venceu! ゴゴゴ'):draw?'Empate! Uma batalha equilibrada.':turn==='X'?'Vez da Mambo!':'Vez do ZA WARUDO!';el('dot').style.background=winner||draw?'#a7b3ca':turn==='X'?'var(--pink)':'var(--gold)';el('dot').style.boxShadow=winner||draw?'none':`0 0 12px ${turn==='X'?'var(--pink)':'var(--gold)'}`;for(const key of ['X','O','D'])el('score'+key).textContent=scores[key]}
function play(i){if(board[i]||winner||draw)return;board[i]=turn;playSound(turn);winning=wins.find(line=>line.every(n=>board[n]===turn))||[];if(winning.length){winner=turn;scores[turn]++}else if(board.every(Boolean)){draw=true;scores.D++}else turn=turn==='X'?'O':'X';render()}
function reset(){board=Array(9).fill(null);turn='X';winner=null;winning=[];draw=false;render()}
el('soundToggle').addEventListener('click',()=>{soundEnabled=!soundEnabled;el('soundToggle').textContent=soundEnabled?'🔊 Som ligado':'🔇 Som desligado';el('soundToggle').setAttribute('aria-pressed',String(soundEnabled));if(!soundEnabled){for(const audio of Object.values(audioClips))audio.pause();if('speechSynthesis' in window)window.speechSynthesis.cancel();}});el('reset').addEventListener('click',reset);el('clear').addEventListener('click',()=>{scores={X:0,O:0,D:0};reset()});render();
</script></body></html>
